name: deploy-cloudflare-worker

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Keep in step with the pnpm version baked into the Docker build
          # (Dockerfile: corepack prepare pnpm@11.17.0). A bare major drifts.
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pinned rather than a floating major: actions/setup-node resolves a
          # bare version from the runner's cache/toolcache, so the deploy could
          # silently run on a different Node than the one the project targets.
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
